<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Deep Space Starfield Background -->
    <linearGradient id="rw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b10" />
      <stop offset="50%" stop-color="#0a131e" />
      <stop offset="100%" stop-color="#05080c" />
    </linearGradient>

    <!-- Glowing Cyan Accent -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Ringed Planet Gradient -->
    <linearGradient id="planet-grad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#c9b99a" />
      <stop offset="60%" stop-color="#6e5c43" />
      <stop offset="100%" stop-color="#1e1810" />
    </linearGradient>

    <!-- HUD Card Gradient -->
    <linearGradient id="hud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1926" />
      <stop offset="100%" stop-color="#080f18" />
    </linearGradient>

    <!-- Hex / Grid Pattern -->
    <pattern id="tactical-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#132335" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <!-- Ground & Atmosphere -->
  <rect width="1200" height="400" fill="url(#rw-bg)" />
  <rect width="1200" height="400" fill="url(#tactical-grid)" />

  <!-- Starfield Stars -->
  <g fill="#93c5fd" opacity="0.65">
    <circle cx="95" cy="80" r="1.5" />
    <circle cx="160" cy="115" r="1.0" />
    <circle cx="280" cy="70" r="1.5" />
    <circle cx="390" cy="95" r="1.0" />
    <circle cx="530" cy="65" r="1.5" />
    <circle cx="720" cy="75" r="1.0" />
    <circle cx="850" cy="60" r="1.5" />
    <circle cx="980" cy="90" r="1.2" />
    <circle cx="1120" cy="70" r="1.5" />
    <circle cx="1060" cy="140" r="1.0" />
    <circle cx="80" cy="240" r="1.2" />
    <circle cx="230" cy="280" r="1.0" />
    <circle cx="480" cy="260" r="1.5" />
  </g>

  <!-- RimWorld Ringed Planet Motif (Upper-Left Backdrop) -->
  <g transform="translate(100, 65)">
    <!-- Back of Planetary Ring -->
    <path d="M -45 5 A 65 18 -25 0 1 65 -22" fill="none" stroke="#8a775b" stroke-width="3" opacity="0.5" />
    <!-- Planet Sphere -->
    <circle cx="10" cy="-5" r="28" fill="url(#planet-grad)" />
    <!-- Front of Planetary Ring -->
    <path d="M 65 -22 A 65 18 -25 0 1 -45 5" fill="none" stroke="#d5c7b0" stroke-width="3.5" opacity="0.85" />
  </g>

  <!-- TOP BAR: RimWorld Colonist Portraits & Time Controls -->
  <!-- Colonist Alice -->
  <g transform="translate(320, 62)">
    <rect x="0" y="0" width="85" height="32" rx="3" fill="#141c26" stroke="#25384d" stroke-width="1" />
    <circle cx="16" cy="14" r="7" fill="#fcd34d" opacity="0.9" />
    <ellipse cx="16" cy="26" rx="9" ry="5" fill="#3b82f6" />
    <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">Alice</text>
    <rect x="32" y="21" width="44" height="3" rx="1.5" fill="#10b981" />
  </g>

  <!-- Colonist Bob -->
  <g transform="translate(415, 62)">
    <rect x="0" y="0" width="85" height="32" rx="3" fill="#141c26" stroke="#25384d" stroke-width="1" />
    <circle cx="16" cy="14" r="7" fill="#fed7aa" opacity="0.9" />
    <ellipse cx="16" cy="26" rx="9" ry="5" fill="#f97316" />
    <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">Bob</text>
    <rect x="32" y="21" width="44" height="3" rx="1.5" fill="#10b981" />
  </g>

  <!-- Colonist Charlie -->
  <g transform="translate(510, 62)">
    <rect x="0" y="0" width="90" height="32" rx="3" fill="#141c26" stroke="#25384d" stroke-width="1" />
    <circle cx="16" cy="14" r="7" fill="#fbcfe8" opacity="0.9" />
    <ellipse cx="16" cy="26" rx="9" ry="5" fill="#8b5cf6" />
    <text x="32" y="16" fill="#e2e8f0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">Charlie</text>
    <rect x="32" y="21" width="48" height="3" rx="1.5" fill="#22c55e" />
  </g>

  <!-- Top-Right RimWorld Game Date & Speed -->
  <g transform="translate(860, 62)">
    <rect x="0" y="0" width="280" height="32" rx="3" fill="#141c26" stroke="#25384d" stroke-width="1" />
    <text x="14" y="21" fill="#cbd5e1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">12 Aprimay, 5502</text>
    <text x="160" y="21" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="bold">⏸ ⏵ ⏵⏵ ⏵⏵⏵</text>
  </g>

  <!-- LEFT PANEL: RimAgent Branding & Core Pitch -->
  <g transform="translate(60, 115)">
    <!-- Eyebrow Tag -->
    <rect x="0" y="0" width="265" height="24" rx="12" fill="#0c1d2e" stroke="#1d4569" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#00e5ff" />
    <text x="26" y="16" fill="#38bdf8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">RIMWORLD 1.6 · AI AGENT</text>

    <!-- Wordmark -->
    <text x="0" y="70" fill="#f8fafc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">RimAgent</text>
    <path d="M 0 84 L 290 84" stroke="url(#cyan-glow)" stroke-width="3" stroke-linecap="round" />

    <!-- Tagline -->
    <text x="0" y="118" fill="#e2e8f0" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600">
      Run your RimWorld colony in natural language.
    </text>

    <!-- Key Metrics Pills -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="95" height="28" rx="5" fill="#0f2236" stroke="#1d4569" stroke-width="1" />
      <text x="47" y="18" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">53 Tools</text>

      <rect x="105" y="0" width="115" height="28" rx="5" fill="#0f2236" stroke="#1d4569" stroke-width="1" />
      <text x="162" y="18" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">Autonomous</text>

      <rect x="230" y="0" width="130" height="28" rx="5" fill="#0f2236" stroke="#1d4569" stroke-width="1" />
      <text x="295" y="18" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600">RimLLM Driven</text>
    </g>
  </g>

  <!-- RIGHT PANEL: Floating In-Game HUD Terminal -->
  <g transform="translate(560, 110)">
    <!-- Terminal Outer Frame -->
    <rect x="0" y="0" width="580" height="175" rx="6" fill="url(#hud-grad)" stroke="#223e5c" stroke-width="1.5" />

    <!-- Terminal Header -->
    <rect x="0" y="0" width="580" height="34" rx="6" fill="#0c1825" />
    <path d="M 0 34 L 580 34" stroke="#223e5c" stroke-width="1" />

    <!-- Status Lights & Title -->
    <circle cx="18" cy="17" r="4.5" fill="#38bdf8" />
    <text x="32" y="21" fill="#f1f5f9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">RimAgent</text>

    <!-- Mode & Effort Badges -->
    <rect x="375" y="7" width="92" height="20" rx="3" fill="#0e273d" stroke="#1d507a" stroke-width="1" />
    <text x="421" y="21" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, Segoe UI, monospace" font-size="12" font-weight="600">Mode: Confirm</text>

    <rect x="475" y="7" width="90" height="20" rx="3" fill="#1c1f36" stroke="#3d447a" stroke-width="1" />
    <text x="520" y="21" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, Segoe UI, monospace" font-size="12" font-weight="600">Effort: Auto</text>

    <!-- Terminal Action Log Stream -->
    <g transform="translate(20, 50)">
      <!-- Line 1: User Instruction -->
      <text x="0" y="12" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="600">&gt; draft everyone and move to (25, 30)</text>

      <!-- Line 2: Tool 1 -->
      <g transform="translate(8, 26)">
        <rect x="0" y="0" width="3" height="16" fill="#34d399" rx="1.5" />
        <text x="10" y="13" fill="#a7f3d0" font-family="Consolas, monospace" font-size="12">draft(colonists: ["Alice", "Bob", "Charlie"], drafted: true)</text>
      </g>

      <!-- Line 3: Tool 2 -->
      <g transform="translate(8, 48)">
        <rect x="0" y="0" width="3" height="16" fill="#34d399" rx="1.5" />
        <text x="10" y="13" fill="#a7f3d0" font-family="Consolas, monospace" font-size="12">order_move(colonists: ["Alice", "Bob", "Charlie"], cell: [25, 30])</text>
      </g>

      <!-- Line 4: Result -->
      <text x="10" y="85" fill="#cbd5e1" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12">
        ✓ 3 colonists drafted and ordered to move to (25, 30).
      </text>

      <!-- Line 5: Next command -->
      <text x="0" y="108" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="600">&gt; list_threats() &#8594; 0 hostiles, perimeter secure</text>
    </g>
  </g>

  <!-- BOTTOM BAR: RimWorld Iconic Architect / Agent Navigation Bar -->
  <g transform="translate(60, 308)">
    <rect x="0" y="0" width="1080" height="30" rx="3" fill="#0d141e" stroke="#223244" stroke-width="1" />
    <g font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#64748b">
      <text x="25" y="20">Architect</text>
      <text x="110" y="20">Work</text>
      <text x="175" y="20">Schedule</text>
      <text x="260" y="20">Assign</text>
      <text x="330" y="20">Animals</text>
      <text x="405" y="20">Wildlife</text>
      <text x="480" y="20">Factions</text>
      <text x="555" y="20">World</text>
    </g>

    <!-- Active Agent Button on Bottom Bar -->
    <g transform="translate(940, 2)">
      <rect x="0" y="0" width="130" height="26" rx="3" fill="#0d2b45" stroke="#00e5ff" stroke-width="1.5" />
      <circle cx="16" cy="13" r="4" fill="#00e5ff" />
      <text x="30" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="700">⚡ Agent</text>
    </g>
  </g>
</svg>
